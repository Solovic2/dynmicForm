# Development overrides — use together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  db:
    ports:
      - "5432:5432" # expose Postgres to the host for local tooling / Prisma Studio

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      PORT: "3000"
      HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@db:5432/dynamicform?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret}
      ACCESS_TOKEN_TTL: 1h
      REFRESH_TOKEN_TTL: 7d
    volumes:
      - ./backend:/app
      - /app/node_modules # anonymous volume keeps container's node_modules
    ports:
      - "3000:3000"
    healthcheck:
      disable: true
    # Apply migrations, then start the dev server with hot reload.
    command: sh -c "npx prisma migrate deploy && npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      # Inside the compose network the backend is reachable by service name
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host
